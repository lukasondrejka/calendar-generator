<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)" />
    <title>Calendar Generator</title>
    <script>
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <meta name="description" content="Effortlessly plan your upcoming weeks with a custom calendar in PDF format. Choose your start date, set week length, and download a ready-to-print PDF to stay organized.">
    <meta name="keywords" content="calendar PDF generator, custom weekly calendar, printable calendar, weekly planner, download calendar PDF, organize weeks, personalized calendar, plan schedule">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div style="display: none;">
      <h1>Calendar Generator</h1>
      <p>Effortlessly plan your upcoming weeks with a custom calendar in PDF format. Choose your start date, set week length, and download a ready-to-print PDF to stay organized.</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
